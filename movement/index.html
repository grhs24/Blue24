<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movement Now</title>
<meta name="description" content="A quiet, private log for sets, weights, and treadmill intervals. Everything stays on your own phone.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Movement Now">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='14' width='28' height='4' rx='2' fill='%2333685A' opacity='0.45'/%3E%3Crect x='6' y='10' width='4' height='12' rx='2' fill='%2333685A'/%3E%3Crect x='22' y='10' width='4' height='12' rx='2' fill='%2333685A'/%3E%3Crect x='11' y='6' width='5' height='20' rx='2.5' fill='%2333685A' opacity='0.72'/%3E%3Crect x='16' y='6' width='5' height='20' rx='2.5' fill='%2333685A' opacity='0.72'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/movement/apple-touch-icon.png">
<link rel="manifest" href="/movement/manifest.webmanifest">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #F2F4EF;
    --surface: #FCFDFB;
    --surface2: #E9EDE5;
    --ink: #22302A;
    --ink2: #59685F;
    --ink3: #6F7F77;
    --line: #DBE1D7;
    --accent: #33685A;
    --accent-strong: #2A574B;
    --accent-soft: #E0EBE5;
    --on-accent: #F4FAF7;
    --danger: #A3402F;
    --danger-soft: #F4E3DE;
    --r-lime: #33685A;
    --r-coral: #AC5B33;
    --r-sky: #47657F;
    --r-amber: #8A6C3E;
    --r-violet: #6B5578;
    --r-mint: #3F7A6B;
    --shadow: 0 1px 2px rgba(34, 48, 42, 0.05), 0 8px 24px -12px rgba(34, 48, 42, 0.14);
    --serif: 'Iowan Old Style', 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', 'Albert Sans', sans-serif;
    --radius: 16px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141B17;
      --surface: #1C2521;
      --surface2: #26312B;
      --ink: #E4EAE5;
      --ink2: #A2B2A8;
      --ink3: #7E8E7C;
      --line: #303C35;
      --accent: #7FC0A8;
      --accent-strong: #95D0BA;
      --accent-soft: #24352E;
      --on-accent: #0F211B;
      --danger: #E08D77;
      --danger-soft: #3A2620;
      --r-lime: #7FC0A8;
      --r-coral: #E0A481;
      --r-sky: #97B2CD;
      --r-amber: #D8BC7A;
      --r-violet: #BCA3CB;
      --r-mint: #86C8B6;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px -14px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; margin: 0; }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; padding: 0; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 16px; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(12px);
    -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid transparent;
    padding-top: env(safe-area-inset-top);
    transition: border-color 0.2s ease;
  }
  .topbar.stuck { border-bottom-color: var(--line); }
  .topbar-in { display: flex; align-items: center; gap: 10px; min-height: 54px; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 19px; font-weight: 600; }
  .brand svg { display: block; }
  .topbar .spacer { flex: 1; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }

  .icon-btn {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px; border-radius: 12px;
    color: var(--ink2); border: 1px solid transparent;
  }
  .icon-btn:hover, .icon-btn:focus-visible { color: var(--ink); background: var(--surface); border-color: var(--line); }

  /* ---------- generic ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 44px; padding: 0 18px; border-radius: 12px;
    background: var(--accent); color: var(--on-accent);
    font-weight: 600; font-size: 15px; border: 1px solid var(--accent);
    transition: transform 0.06s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--accent); }
  .btn.quiet { background: transparent; color: var(--ink2); border-color: transparent; padding: 0 10px; }
  .btn.quiet:hover { color: var(--ink); }
  .btn.sm { min-height: 36px; padding: 0 13px; font-size: 14px; border-radius: 10px; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface2); color: var(--ink2);
    font-size: 12.5px; font-weight: 600; line-height: 1.5;
  }
  .chip.setup { background: var(--accent-soft); color: var(--accent-strong); }
  @media (prefers-color-scheme: dark) { .chip.setup { color: var(--accent); } }

  .muted { color: var(--ink2); }
  .tiny { font-size: 13px; }
  .center { text-align: center; }
  .stack { display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .sec-title { font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink3); font-weight: 700; margin: 26px 0 10px; }

  .empty { padding: 26px 18px; text-align: center; color: var(--ink2); font-size: 14.5px; }

  /* ---------- number fields ---------- */
  .field {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px;
    align-items: center; height: 46px;
    background: var(--surface2); border-radius: 12px; border: 1px solid transparent;
  }
  .field:focus-within { border-color: var(--accent); background: var(--surface); }
  .field button { height: 100%; color: var(--ink3); font-size: 18px; line-height: 1; border-radius: 12px; }
  .field button:active { color: var(--accent); }
  /* Number over unit, so a long value never runs into its label. */
  .field .val {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; min-width: 0; padding-top: 3px;
  }
  .field input {
    width: 100%; height: 20px; border: none; background: none; outline: none;
    text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 0; -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field .unit {
    font-size: 8.5px; letter-spacing: 0.12em; line-height: 1; margin-top: 2px;
    text-transform: uppercase; color: var(--ink3); font-weight: 700; pointer-events: none;
  }

  .leg { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 7px; align-items: center; }
  .leg + .leg { margin-top: 7px; }
  .leg-tag { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
  .leg-note { font-size: 12px; color: var(--ink3); padding-left: 2px; }
  .leg .field { grid-template-columns: 28px minmax(0, 1fr) 28px; }
  .leg.pace { grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 32px; }
  .leg.add > button { justify-content: flex-start; padding: 0; white-space: nowrap; }
  .leg.apart { margin-top: 15px; }
  @media (max-width: 359px) {
    .leg { grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr); gap: 5px; }
    .leg.pace { grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr) 28px; }
    /* The row's label cell is empty, so the button takes it and keeps one line. */
    .leg.add { grid-template-columns: 0 auto minmax(0, 1fr); }
    .leg .field { grid-template-columns: minmax(0, 1fr); }
    .leg .field > button { display: none; }
  }

  input[type="text"] {
    width: 100%; padding: 11px 13px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input::placeholder { color: var(--ink3); }

  /* ---------- page furniture ---------- */
  .hero { padding: 22px 2px 6px; }
  .hero h1 { font-size: 30px; line-height: 1.15; }
  .hero p { margin: 7px 0 0; color: var(--ink2); font-size: 15px; }

  .list-card { padding: 0; overflow: hidden; }

  label.lbl {
    display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink3); font-weight: 700; margin-bottom: 5px;
  }

  .set-n { font-size: 13px; font-weight: 700; color: var(--ink3); font-variant-numeric: tabular-nums; text-align: center; }

  .routine-head { display: flex; align-items: center; gap: 8px; margin: 26px 0 10px; }
  .routine-head .sec-title { margin: 0; flex: 1; min-width: 0; color: var(--tone); }

  /* ---------- plan ---------- */
  .plan-mv { display: flex; align-items: center; gap: 8px; padding: 11px 14px; }
  .plan-mv + .plan-mv { border-top: 1px solid var(--line); }
  .plan-mv .grip { flex: 1; min-width: 0; text-align: left; }
  .plan-mv b { display: block; font-size: 15px; font-weight: 600; }
  .plan-mv span { display: block; font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .mini { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; color: var(--ink3); border: 1px solid var(--line); }
  .mini:hover { color: var(--ink); border-color: var(--accent); }
  .mini:disabled { opacity: 0.3; }

  .edit-grid { display: grid; gap: 10px; padding: 13px 14px 15px; border-top: 1px solid var(--line); background: var(--surface2); }
  /* Rows of one set sit tight together; the gap marks where the next begins. */
  .edit-sets { display: grid; gap: 4px; }
  .edit-set { display: grid; grid-template-columns: 20px 1fr 1fr 32px; gap: 6px; align-items: center; }
  .edit-set.opens:not(:first-child) { margin-top: 9px; }
  .edit-set input { text-align: center; }
  .edit-set .lbl-in { position: relative; }
  .edit-set .lbl-in i { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink3); font-weight: 700; }
  .edit-set input[type="text"] { padding-right: 34px; }
  .edit-set.add { grid-template-columns: 20px auto minmax(0, 1fr); }
  .edit-set.add > button { justify-content: flex-start; padding: 0; white-space: nowrap; min-height: 30px; }
  .set-note { font-size: 12px; color: var(--ink3); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60;
    background: var(--ink); color: var(--bg); padding: 10px 17px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .foot { padding: 30px 4px 10px; text-align: center; font-size: 12.5px; color: var(--ink3); line-height: 1.7; }
  .foot a { color: var(--ink2); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="wrap topbar-in">
    <span class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="14" width="28" height="4" rx="2" fill="currentColor" opacity="0.4"></rect>
        <rect x="6" y="10" width="4" height="12" rx="2" fill="currentColor"></rect>
        <rect x="22" y="10" width="4" height="12" rx="2" fill="currentColor"></rect>
        <rect x="11" y="6" width="5" height="20" rx="2.5" fill="currentColor" opacity="0.72"></rect>
        <rect x="16" y="6" width="5" height="20" rx="2.5" fill="currentColor" opacity="0.72"></rect>
      </svg>
      Movement Now
    </span>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Movement Now — a logger, and nothing else.

     One page. Every number on it is what you can currently do,
     edited in place. No sessions, no timers, no history: routines
     are written elsewhere and timed elsewhere; this holds the
     numbers.
     ============================================================ */

  const KEY = "movement.v1";
  const UNIT = "lb";

  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

  // A set is a list of `steps`, so the weight can drop partway through:
  // eight reps at 40, then seven at 30.
  function set(w, r, note) { return { steps: [{ w: w, r: r }], note: note || "" }; }

  function setReps(st) {
    return (st.steps || []).reduce((n, s) => n + Math.max(0, Math.round(Number(s.r) || 0)), 0);
  }

  function mv(id, name, sets, opts) {
    opts = opts || {};
    return { id: id, name: name, setup: opts.setup || "", step: opts.step || 5, sets: sets };
  }

  function steady(label, secs, mph, incline) {
    return { id: uid(), type: "steady", label: label, secs: secs, mph: mph, incline: incline || 0 };
  }

  // Each leg carries `paces`, its speed steps: two blocks at 9, then six at 8.
  function leg(secs, paces) {
    return { secs: secs, paces: paces.map(p => ({ reps: p[0], mph: p[1] })) };
  }

  function repeatBlock(label, wSecs, wPaces, rSecs, rPaces, incline) {
    return {
      id: uid(), type: "repeat", label: label,
      work: leg(wSecs, wPaces), rest: leg(rSecs, rPaces), incline: incline || 0
    };
  }

  function legReps(lg) {
    return (lg.paces || []).reduce((n, p) => n + Math.max(1, Math.round(Number(p.reps) || 1)), 0);
  }

  // The fast leg says how long the block runs; the slower leg's steps are
  // shares of those same rounds.
  function blockReps(b) {
    return legReps(b.work);
  }

  function seed() {
    return {
      v: 2,
      routines: [
        {
          id: "upper", name: "Upper Body", tone: "lime", icon: "upper", kind: "lift",
          items: [
            mv("u-chest-press", "Chest Press", [set(65, 10), set(65, 10, "Drop to 55 halfway."), set(55, 10)], { step: 5 }),
            mv("u-lat-pulldown", "Lat Pulldown", [set(77, 10), set(66, 10), set(66, 10)], { step: 11 }),
            mv("u-row", "Seated Cable or Machine Row", [set(55, 10), set(55, 10), set(44, 10)], { step: 11 }),
            mv("u-shoulder-press", "Machine Shoulder Press", [set(10, 10), set(10, 10), set(10, 10)], { step: 5 }),
            mv("u-lateral-raise", "Dumbbell Lateral Raise", [set(7.5, 12), set(7.5, 12), set(5, 12)], { step: 2.5 }),
            mv("u-rear-delts", "Reverse Pec Deck—Rear Delts", [set(30, 12), set(30, 12), set(20, 12)], { step: 5 }),
            mv("u-triceps", "Cable Triceps Pulldown", [set(22, 12), set(11, 12), set(11, 12)], { step: 11 }),
            mv("u-biceps", "Dumbbell or Cable Bicep Curls", [set(12.5, 10), set(10, 10), set(10, 10)], { step: 2.5 }),
            mv("u-incline-press", "Incline Dumbbell Press", [set(17.5, 10), set(15, 10), set(15, 10)], { step: 2.5 }),
            mv("u-preacher-curl", "Dumbbell Preacher Curl", [set(30, 10), set(20, 10), set(20, 10)], { step: 5, setup: "Seat 8" })
          ]
        },
        {
          id: "core", name: "Core", tone: "coral", icon: "core", kind: "lift",
          items: [
            mv("c-kneeling-crunch", "Cable Kneeling Crunch", [set(40, 12), set(40, 12), set(40, 12)], { step: 5 }),
            mv("c-knee-raise", "Captain's Chair Knee Raise", [set(0, 8), set(0, 8), set(0, 8)], { step: 5 }),
            mv("c-pallof", "Pallof Press", [set(20, 10), set(20, 10), set(20, 10)], { step: 5, setup: "Each side" }),
            mv("c-ab-crunch", "Abdominal Crunch", [set(0, 15), set(0, 15), set(0, 15)], { step: 5 }),
            mv("c-wood-chop", "Cable Wood Chop", [set(20, 10), set(20, 10), set(20, 10)], { step: 5, setup: "Each side" }),
            mv("c-dead-bug", "Weighted Dead Bug", [set(0, 8), set(0, 8), set(0, 8)], { step: 2.5 })
          ]
        },
        {
          id: "lower", name: "Lower Body", tone: "sky", icon: "lower", kind: "lift",
          items: [
            mv("l-leg-press", "Seated Leg Press", [set(100, 10), set(100, 10), set(100, 10)], { step: 10, setup: "Seat 5" }),
            mv("l-ham-curl", "Seated Hamstring Curl", [set(20, 10), set(20, 10), set(20, 10)], { step: 5, setup: "Leg part 5" }),
            mv("l-leg-extension", "Leg Extension", [set(30, 10), set(30, 10), set(30, 10)], { step: 5, setup: "Leg part large, rotator standing up" }),
            mv("l-abductor", "Hip Abductor Machine", [set(40, 12), set(30, 12), set(30, 12)], { step: 5, setup: "Leg part 2" }),
            mv("l-adductor", "Hip Adductor Machine", [set(40, 12), set(30, 12), set(30, 12)], { step: 5, setup: "Leg part 7" }),
            mv("l-calf", "Standing Calf Machine", [set(10, 12), set(0, 12), set(0, 12)], { step: 5, setup: "Top part 3" })
          ]
        },
        {
          id: "tread", name: "Treadmill", tone: "amber", icon: "tread", kind: "tread",
          blocks: [repeatBlock("Sprints", 30, [[10, 12.5]], 90, [[10, 3.5]])]
        }
      ]
    };
  }

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (err) { S = seed(); }
  if (!S.routines || !S.routines.length) S = seed();

  /* ---- carry older saves forward ---- */

  const OLD_TONES = { upper: "lime", core: "coral", lower: "sky", tread: "amber" };

  // Runs on load and on every restore, so a backup written by any earlier
  // version opens. Each step is written to be safe to run again.
  function carryForward(d) {
    (d.routines || []).forEach(function (r) {
      if (!r.icon) r.icon = OLD_TONES[r.tone] ? r.tone : (r.kind === "tread" ? "tread" : "upper");
      if (OLD_TONES[r.tone]) r.tone = OLD_TONES[r.tone];
      if (!r.tone) r.tone = "lime";
      // Treadmill used to be a flat list of minute-long intervals.
      if (r.intervals && !r.blocks) {
        r.blocks = r.intervals.map(iv => steady(iv.label || "", Math.round((Number(iv.min) || 0) * 60), Number(iv.mph) || 0, Number(iv.incline) || 0));
        delete r.intervals;
      }
      if (r.kind === "tread" && !r.blocks) r.blocks = [repeatBlock("Sprints", 30, [[10, 12.5]], 90, [[10, 3.5]])];
      // A set used to hold one weight and one rep count.
      (r.items || []).forEach(function (it) {
        (it.sets || []).forEach(function (st) {
          if (!(st.steps || []).length) st.steps = [{ w: Number(st.w) || 0, r: Number(st.r) || 0 }];
          delete st.w;
          delete st.r;
        });
      });
      (r.blocks || []).forEach(function (b) {
        if (b.type !== "repeat") return;
        b.work = b.work || {};
        b.rest = b.rest || {};
        // First shape: one speed for every round, counted on the block itself.
        if (b.reps != null && !b.paces && !b.work.paces) {
          b.paces = [{ reps: Math.max(1, Number(b.reps) || 1), mph: Number(b.work.mph) || 0 }];
        }
        delete b.reps;
        // Second shape: the fast leg's steps sat on the block, and the slower
        // leg still held a single speed.
        if (b.paces) { b.work.paces = b.paces; delete b.paces; }
        if (b.work.mph != null) {
          if (!b.work.paces) b.work.paces = [{ reps: 1, mph: Number(b.work.mph) || 0 }];
          delete b.work.mph;
        }
        if (b.rest.mph != null) {
          b.rest.paces = [{ reps: 1, mph: Number(b.rest.mph) || 0 }];
          delete b.rest.mph;
        }
        if (!(b.work.paces || []).length) b.work.paces = [{ reps: 1, mph: 0 }];
        if (!(b.rest.paces || []).length) b.rest.paces = [{ reps: 1, mph: 0 }];
      });
    });
    // Sessions, drafts, speed records and the rest-timer setting belonged to
    // the old start-and-finish app. The plan itself is the record now.
    ["sessions", "draft", "bests", "prefs"].forEach(function (k) { delete d[k]; });
    d.v = 2;
    return d;
  }

  carryForward(S);
  try { localStorage.removeItem("movement.key"); } catch (err) { /* ignore */ }

  let saveTimer = null;
  function saveNow() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (err) { /* ignore */ }
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(S)); }
      catch (err) { toast("Could not save—storage is full."); }
    }, 120);
  }
  saveNow();

  /* ============================================================
     Helpers
     ============================================================ */

  const $ = (sel, root) => (root || document).querySelector(sel);
  const app = $("#app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function num(n) {
    if (n == null || n === "" || isNaN(n)) return "0";
    return String(Math.round(Number(n) * 100) / 100);
  }

  function weightLabel(w) { return Number(w) > 0 ? num(w) + " " + UNIT : "empty"; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
  function clockOf(secs) {
    const s = Math.max(0, Math.round(secs));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("on"), 2000);
  }

  const routineById = id => S.routines.filter(r => r.id === id)[0];

  function findMv(id) {
    for (const r of S.routines) {
      const hit = (r.items || []).filter(x => x.id === id)[0];
      if (hit) return hit;
    }
    return null;
  }

  function findBlock(id) {
    for (const r of S.routines) {
      const hit = (r.blocks || []).filter(x => x.id === id)[0];
      if (hit) return hit;
    }
    return null;
  }

  const TONES = ["lime", "coral", "sky", "amber", "violet", "mint"];
  function nextTone() {
    const used = S.routines.map(r => r.tone);
    return TONES.filter(t => used.indexOf(t) < 0)[0] || TONES[S.routines.length % TONES.length];
  }

  /* ============================================================
     Icons
     ============================================================ */

  const ICONS = {
    up: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"></path><path d="M6 11l6-6 6 6"></path></svg>',
    down: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13"></path><path d="M6 13l6 6 6-6"></path></svg>',
    pencil: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"></path><path d="M14 6l4 4"></path></svg>',
    trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V5h6v2"></path><path d="M6.5 7l1 13h9l1-13"></path></svg>',
    x: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>'
  };

  /* ============================================================
     What is open for editing
     ============================================================ */

  const V = { editing: null };

  /* ============================================================
     Number field
     ============================================================ */

  function field(act, id, leg, k, val, step, unit, pi) {
    const at = ' data-id="' + id + '" data-leg="' + leg + '" data-k="' + k + '" data-step="' + step +
      '" data-pi="' + (pi == null ? "" : pi) + '"';
    return '<div class="field">' +
      '<button data-act="' + act + 'bump"' + at + ' data-d="-1" aria-label="Less">−</button>' +
      '<span class="val"><input type="number" inputmode="decimal" step="any" value="' + num(val) +
      '" data-act="' + act + 'num"' + at + ">" +
      '<span class="unit">' + unit + "</span></span>" +
      '<button data-act="' + act + 'bump"' + at + ' data-d="1" aria-label="More">+</button>' +
      "</div>";
  }

  function stepOf(t) {
    return Number(t.dataset.step) || 1;
  }

  // Where a field writes to: one of the two legs, a speed step inside a leg,
  // or the block itself.
  function holderOf(b, which, pi) {
    const h = which ? b[which] : b;
    if (!h) return null;
    return pi === "" || pi == null ? h : (h.paces || [])[Number(pi)];
  }

  /* ============================================================
     Movements
     ============================================================ */

  const wShort = w => weightLabel(w).replace(" " + UNIT, "");

  // Sets that are one weight for one rep count read as they always have—
  // 65 · 65 · 55 × 10. Once a weight changes partway, each set spells itself
  // out instead: 40×8, 30×7 · 40×8.
  function mvLine(it) {
    const sets = it.sets, first = sets[0].steps[0];
    const plain = sets.every(s => s.steps.length === 1 && num(s.steps[0].r) === num(first.r));
    const body = plain
      ? sets.map(s => wShort(s.steps[0].w)).join(" · ") + " × " + num(first.r)
      : sets.map(s => s.steps.map(x => wShort(x.w) + "×" + num(x.r)).join(", ")).join(" · ");
    return body + (it.setup ? " · " + it.setup : "");
  }

  // Only worth stating once a set is split across weights.
  function setNote(st) {
    return st.steps.length > 1 ? plural(setReps(st), "rep") + " in all" : "";
  }

  function mvRow(r, it, i) {
    const open = V.editing === it.id;
    let html = '<div class="plan-mv">' +
      '<button class="grip" data-act="edit" data-id="' + it.id + '"><b>' + esc(it.name) + "</b>" +
      '<span data-line="' + it.id + '">' + esc(mvLine(it)) + "</span></button>" +
      '<button class="mini" data-act="mvup" data-rid="' + r.id + '" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">' + ICONS.up + "</button>" +
      '<button class="mini" data-act="mvdown" data-rid="' + r.id + '" data-i="' + i + '"' + (i === r.items.length - 1 ? " disabled" : "") + ' aria-label="Move down">' + ICONS.down + "</button>" +
      '<button class="mini" data-act="edit" data-id="' + it.id + '" aria-label="Edit">' + ICONS.pencil + "</button>" +
      "</div>";
    if (open) html += mvForm(r, it);
    return html;
  }

  function mvForm(r, it) {
    let html = '<div class="edit-grid">' +
      '<div><label class="lbl">Name</label><input type="text" value="' + esc(it.name) + '" data-act="mvname" data-id="' + it.id + '"></div>' +
      '<div><label class="lbl">Setup note</label><input type="text" value="' + esc(it.setup || "") + '" placeholder="Seat 8, leg part 2…" data-act="mvsetup" data-id="' + it.id + '"></div>' +
      '<div><label class="lbl">Sets</label><div class="edit-sets">';

    it.sets.forEach(function (st, i) {
      const many = st.steps.length > 1;
      st.steps.forEach(function (sp, si) {
        // Only the first row of a set is numbered; the rest are the same set
        // carrying on at a new weight.
        const at = ' data-id="' + it.id + '" data-i="' + i + '" data-si="' + si + '"';
        html += '<div class="edit-set' + (si ? "" : " opens") + '">' +
          '<span class="set-n">' + (si ? "" : i + 1) + "</span>" +
          '<span class="lbl-in"><input type="text" inputmode="decimal" value="' + num(sp.w) + '" data-act="setw"' + at + "><i>" + UNIT + "</i></span>" +
          '<span class="lbl-in"><input type="text" inputmode="numeric" value="' + num(sp.r) + '" data-act="setr"' + at + "><i>reps</i></span>" +
          '<button class="mini" data-act="delstep"' + at + ' aria-label="' + (many ? "Remove weight" : "Remove set") + '"' +
          (many || it.sets.length > 1 ? "" : " disabled") + ">" + ICONS.x + "</button></div>";
      });
      html += '<div class="edit-set add"><span class="set-n"></span>' +
        '<button class="btn quiet sm" data-act="addstep" data-id="' + it.id + '" data-i="' + i + '">+ Weight change</button>' +
        '<span class="set-note" data-reps="' + it.id + "-" + i + '">' + setNote(st) + "</span></div>";
    });

    html += "</div></div>" +
      '<div><label class="lbl">− and + jump by</label>' +
      '<input type="text" inputmode="decimal" style="text-align:center" value="' + num(it.step) + '" data-act="mvstep" data-id="' + it.id + '">' +
      '<p class="tiny muted" style="margin:7px 2px 0">How far one tap moves the weight—11 on the stacks numbered in elevens, 2.5 on dumbbells. The seat number goes in the setup note.</p></div>' +
      '<div class="row" style="gap:8px"><button class="btn ghost sm" data-act="addset" data-id="' + it.id + '">+ Set</button>' +
      '<button class="btn quiet sm" data-act="edit" data-id="">Done</button>' +
      '<span style="flex:1"></span>' +
      '<button class="btn quiet sm" style="color:var(--danger)" data-act="delmv" data-rid="' + r.id + '" data-id="' + it.id + '">' + ICONS.trash + "</button></div>" +
      "</div>";
    return html;
  }

  /* ============================================================
     Treadmill blocks

     A repeat block is one interval shape: a fast leg and a slower
     leg, and how many times round. Keep one per combination you do.
     ============================================================ */

  function paceText(lg) {
    const p = lg.paces || [];
    if (p.length === 1) return num(p[0].mph);
    return p.map(x => num(x.mph) + "×" + num(x.reps)).join(", ");
  }

  function blockSummary(b) {
    return b.type === "repeat"
      ? plural(blockReps(b), "block") + " · " + num(b.work.secs) + "s at " + paceText(b.work) +
        " / " + num(b.rest.secs) + "s at " + paceText(b.rest)
      : clockOf(b.secs) + " at " + num(b.mph) + " mph";
  }

  function blockName(b) {
    return b.label || (b.type === "repeat" ? "Intervals" : "Steady");
  }

  function blockTotal(b) {
    return b.type === "repeat"
      ? (Number(b.work.secs) + Number(b.rest.secs)) * blockReps(b)
      : Number(b.secs) || 0;
  }

  function blockLine(b) {
    return blockSummary(b) + (Number(b.incline) ? " · " + num(b.incline) + "%" : "") +
      " · " + clockOf(blockTotal(b));
  }

  function blockRow(r, b, i) {
    const open = V.editing === b.id;
    let html = '<div class="plan-mv">' +
      '<button class="grip" data-act="bkedit" data-id="' + b.id + '"><b>' + esc(blockName(b)) + "</b>" +
      '<span data-line="' + b.id + '">' + blockLine(b) + "</span></button>" +
      '<button class="mini" data-act="bkup" data-rid="' + r.id + '" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">' + ICONS.up + "</button>" +
      '<button class="mini" data-act="bkdown" data-rid="' + r.id + '" data-i="' + i + '"' + (i === r.blocks.length - 1 ? " disabled" : "") + ' aria-label="Move down">' + ICONS.down + "</button>" +
      '<button class="mini" data-act="bkedit" data-id="' + b.id + '" aria-label="Edit">' + ICONS.pencil + "</button>" +
      "</div>";
    if (open) html += blockForm(r, b);
    return html;
  }

  // What sits beside a leg's "+ Speed change": the fast leg counts the block
  // out, so the slower leg can only report how much of it its steps cover.
  function legNote(b, which) {
    const all = blockReps(b), lg = b[which];
    if (which === "work") return plural(all, "block") + " · " + clockOf(blockTotal(b));
    if (lg.paces.length < 2) return "the whole block";
    const n = legReps(lg);
    if (n === all) return plural(n, "block");
    return n + " of " + all + (n < all ? "—the last one holds" : "—the extra is ignored");
  }

  // Typing must not re-render the field under the cursor, so the row above the
  // open form is patched in place instead.
  function refreshRow(id) {
    const line = $('[data-line="' + id + '"]');
    if (!line) return;
    const it = findMv(id), b = it ? null : findBlock(id);
    if (!it && !b) return;
    line.textContent = it ? mvLine(it) : blockLine(b);
    const name = line.previousElementSibling;
    if (name) name.textContent = it ? it.name : blockName(b);
    if (b) ["work", "rest"].forEach(function (which) {
      const note = $('[data-total="' + id + "-" + which + '"]');
      if (note) note.textContent = legNote(b, which);
    });
    if (it) it.sets.forEach(function (st, i) {
      const note = $('[data-reps="' + id + "-" + i + '"]');
      if (note) note.textContent = setNote(st);
    });
  }

  // A leg: how long it lasts, then one row per speed step, then the button
  // that adds another. Two blocks at 9, then six at 8.
  function legRows(b, which, tag) {
    const lg = b[which], many = lg.paces.length > 1;
    let html = '<div class="leg' + (which === "rest" ? " apart" : "") + '"><span class="leg-tag">' + tag + "</span>" +
      field("bk", b.id, which, "secs", lg.secs, 5, "sec") + '<span class="leg-note">each</span></div>';

    lg.paces.forEach(function (pc, pi) {
      // The fast leg's counts add up to the block, so they always show. On the
      // slower leg a lone speed covers everything and needs no count.
      const count = which === "work" || many
        ? field("bk", b.id, which, "reps", pc.reps, 1, "blocks", pi)
        : "<span></span>";
      html += '<div class="leg pace"><span class="leg-tag">' + (pi === 0 ? "at" : "then") + "</span>" +
        field("bk", b.id, which, "mph", pc.mph, 0.5, "mph", pi) + count +
        '<button class="mini" data-act="delpace" data-id="' + b.id + '" data-leg="' + which + '" data-pi="' + pi +
        '" aria-label="Remove speed"' + (many ? "" : " disabled") + ">" + ICONS.x + "</button></div>";
    });

    return html + '<div class="leg add"><span class="leg-tag"></span>' +
      '<button class="btn quiet sm" data-act="addpace" data-id="' + b.id + '" data-leg="' + which + '">+ Speed change</button>' +
      '<span class="leg-note" data-total="' + b.id + "-" + which + '">' + legNote(b, which) + "</span></div>";
  }

  function blockForm(r, b) {
    const f = (which, k, val, step, unit) => field("bk", b.id, which, k, val, step, unit);
    let html = '<div class="edit-grid">' +
      '<div><label class="lbl">Name</label><input type="text" value="' + esc(b.label || "") + '" placeholder="' +
      (b.type === "repeat" ? "Sprints" : "Warm up") + '" data-act="bklabel" data-id="' + b.id + '"></div>';

    if (b.type === "repeat") {
      html += legRows(b, "work", "Fast") + legRows(b, "rest", "Slower");
    } else {
      html += '<div class="leg"><span class="leg-tag">Run</span>' + f("", "secs", b.secs, 30, "sec") + f("", "mph", b.mph, 0.5, "mph") + "</div>";
    }

    html += '<div class="leg"><span class="leg-tag">Incline</span>' + f("", "incline", b.incline, 0.5, "%") + "<span></span></div>" +
      '<div class="row" style="gap:8px"><button class="btn quiet sm" data-act="bkedit" data-id="">Done</button>' +
      '<span style="flex:1"></span>' +
      '<button class="btn quiet sm" style="color:var(--danger)" data-act="bkdel" data-rid="' + r.id + '" data-id="' + b.id + '">' + ICONS.trash + "</button></div>" +
      "</div>";
    return html;
  }

  /* ============================================================
     Backup
     ============================================================ */

  function backup() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "movement-now-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Backed up.");
  }

  function restore(file) {
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !data.routines) throw new Error("bad file");
        if (!confirm("Replace everything on this device with the backup?")) return;
        S = carryForward(data);
        V.editing = null;
        save(); render();
        toast("Restored.");
      } catch (err) {
        toast("That file did not look right.");
      }
    };
    reader.readAsText(file);
  }

  /* ============================================================
     The page
     ============================================================ */

  function render() {
    let html = '<section class="hero"><h1>Where you are</h1>' +
      "<p>Every number here is what you can currently do. Tap one to change it.</p></section>";

    S.routines.forEach(function (r) {
      html += '<div class="routine-head" style="--tone:var(--r-' + r.tone + ')">' +
        '<span class="sec-title">' + esc(r.name) + "</span>" +
        '<button class="mini" data-act="rrename" data-rid="' + r.id + '" aria-label="Rename">' + ICONS.pencil + "</button>" +
        (S.routines.length > 1 ? '<button class="mini" data-act="rdel" data-rid="' + r.id + '" aria-label="Delete">' + ICONS.trash + "</button>" : "") +
        "</div>";

      html += '<article class="card list-card">';
      if (r.kind === "tread") {
        (r.blocks || []).forEach(function (b, i) { html += blockRow(r, b, i); });
        html += '<div class="plan-mv" style="gap:6px">' +
          '<button class="btn quiet sm" data-act="addblk" data-rid="' + r.id + '" data-k="repeat">+ Intervals</button>' +
          '<button class="btn quiet sm" data-act="addblk" data-rid="' + r.id + '" data-k="steady">+ Steady</button>' +
          "</div>";
      } else {
        (r.items || []).forEach(function (it, i) { html += mvRow(r, it, i); });
        html += '<div class="plan-mv"><button class="btn quiet sm" data-act="addmv" data-rid="' + r.id + '">+ Add a movement</button></div>';
      }
      html += "</article>";
    });

    html += '<div style="height:18px"></div>' +
      '<div class="row" style="gap:8px">' +
      '<button class="btn ghost" style="flex:1" data-act="newroutine" data-k="lift">+ Movements</button>' +
      '<button class="btn ghost" style="flex:1" data-act="newroutine" data-k="tread">+ Treadmill</button>' +
      "</div>";

    html += '<div class="sec-title">Your data</div><article class="card" style="padding:14px">' +
      '<p class="tiny muted" style="margin:0 0 12px">Everything lives in this browser only. Back it up before you switch phones or clear your history.</p>' +
      '<div class="row" style="gap:8px"><button class="btn ghost sm" data-act="backup">Back up</button>' +
      '<button class="btn ghost sm" data-act="restore">Restore</button>' +
      '<input type="file" id="restore-file" accept="application/json,.json" hidden></div></article>';

    html += '<p class="foot">Movement Now—yours, on this phone.</p>';

    app.innerHTML = html;
  }

  /* ============================================================
     Events
     ============================================================ */

  document.addEventListener("click", function (e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;
    const i = Number(t.dataset.i), si = Number(t.dataset.si);

    switch (act) {
      /* ---- movements ---- */
      case "edit": V.editing = (V.editing === t.dataset.id || !t.dataset.id) ? null : t.dataset.id; render(); break;
      case "mvup": case "mvdown": {
        const r = routineById(t.dataset.rid);
        const j = act === "mvup" ? i - 1 : i + 1;
        if (j < 0 || j >= r.items.length) break;
        const tmp = r.items[i]; r.items[i] = r.items[j]; r.items[j] = tmp;
        save(); render();
        break;
      }
      case "addmv": {
        const r = routineById(t.dataset.rid);
        const fresh = mv(uid(), "New movement", [set(0, 10), set(0, 10), set(0, 10)]);
        r.items.push(fresh);
        V.editing = fresh.id;
        save(); render();
        break;
      }
      case "delmv": {
        const r = routineById(t.dataset.rid);
        if (confirm("Remove this movement?")) {
          r.items = r.items.filter(x => x.id !== t.dataset.id);
          V.editing = null;
          save(); render();
        }
        break;
      }
      case "addset": {
        const it = findMv(t.dataset.id);
        const last = it.sets[it.sets.length - 1];
        it.sets.push({ steps: last.steps.map(s => ({ w: s.w, r: s.r })), note: "" });
        save(); render();
        break;
      }
      case "addstep": {
        const it = findMv(t.dataset.id);
        const st = it.sets[Number(t.dataset.i)];
        if (!st) break;
        // Split the reps rather than adding more, so the set stays as long as
        // it was: fifteen becomes eight and seven.
        const last = st.steps[st.steps.length - 1];
        const n = Math.max(2, Math.round(Number(last.r) || 0));
        const keep = Math.ceil(n / 2);
        last.r = keep;
        st.steps.push({ w: Math.max(0, Number(last.w) - (Number(it.step) || 5)), r: n - keep });
        save(); render();
        break;
      }
      case "delstep": {
        const it = findMv(t.dataset.id);
        // The ✕ takes the weight off a set that has several, or the whole set
        // when that weight is all it is.
        if (it.sets[i].steps.length > 1) it.sets[i].steps.splice(si, 1);
        else if (it.sets.length > 1) it.sets.splice(i, 1);
        save(); render();
        break;
      }

      /* ---- treadmill blocks ---- */
      case "bkedit": V.editing = (V.editing === t.dataset.id || !t.dataset.id) ? null : t.dataset.id; render(); break;
      case "bkup": case "bkdown": {
        const r = routineById(t.dataset.rid);
        const j = act === "bkup" ? i - 1 : i + 1;
        if (j < 0 || j >= r.blocks.length) break;
        const tmp = r.blocks[i]; r.blocks[i] = r.blocks[j]; r.blocks[j] = tmp;
        save(); render();
        break;
      }
      case "addblk": {
        const r = routineById(t.dataset.rid);
        const fresh = t.dataset.k === "repeat" ? repeatBlock("", 30, [[10, 10]], 90, [[10, 3.5]]) : steady("", 300, 3.5);
        r.blocks.push(fresh);
        V.editing = fresh.id;
        save(); render();
        break;
      }
      case "bkdel": {
        const r = routineById(t.dataset.rid);
        if ((r.blocks || []).length < 2) { toast("Keep at least one."); break; }
        r.blocks = r.blocks.filter(b => b.id !== t.dataset.id);
        V.editing = null;
        save(); render();
        break;
      }
      case "addpace": {
        const b = findBlock(t.dataset.id);
        const lg = b && b[t.dataset.leg];
        if (!lg) break;
        // Split the last step rather than adding rounds, so the block stays
        // the length it was.
        const last = lg.paces[lg.paces.length - 1];
        const n = lg.paces.length > 1 ? Math.max(1, Math.round(Number(last.reps) || 1)) : blockReps(b);
        const keep = Math.ceil(n / 2);
        last.reps = keep;
        lg.paces.push({ reps: Math.max(1, n - keep), mph: Math.max(0, Number(last.mph) - 0.5) });
        save(); render();
        break;
      }
      case "delpace": {
        const lg = (findBlock(t.dataset.id) || {})[t.dataset.leg];
        if (lg && lg.paces.length > 1) lg.paces.splice(Number(t.dataset.pi), 1);
        save(); render();
        break;
      }
      case "bkbump": {
        const b = findBlock(t.dataset.id);
        if (!b) break;
        const holder = holderOf(b, t.dataset.leg, t.dataset.pi);
        if (!holder) break;
        const k = t.dataset.k;
        holder[k] = Math.max(k === "reps" ? 1 : 0,
          Math.round(((Number(holder[k]) || 0) + Number(t.dataset.d) * stepOf(t)) * 10) / 10);
        save(); render();
        break;
      }

      /* ---- routines ---- */
      case "newroutine": {
        const kind = t.dataset.k;
        const fresh = { id: uid(), name: kind === "tread" ? "New treadmill" : "New routine",
          tone: nextTone(), icon: kind === "tread" ? "tread" : "upper", kind: kind };
        if (kind === "tread") fresh.blocks = [repeatBlock("", 30, [[10, 10]], 90, [[10, 3.5]])];
        else fresh.items = [mv(uid(), "New movement", [set(0, 10), set(0, 10), set(0, 10)])];
        S.routines.push(fresh);
        save(); render();
        toast("Added.");
        break;
      }
      case "rrename": {
        const r = routineById(t.dataset.rid);
        const name = prompt("Name for this routine", r.name);
        if (name && name.trim()) { r.name = name.trim().slice(0, 40); save(); render(); }
        break;
      }
      case "rdel": {
        const r = routineById(t.dataset.rid);
        if (S.routines.length < 2) break;
        if (confirm("Remove " + r.name + "?")) {
          S.routines = S.routines.filter(x => x.id !== r.id);
          save(); render();
        }
        break;
      }

      /* ---- data ---- */
      case "backup": backup(); break;
      case "restore": $("#restore-file").click(); break;
    }
  });

  document.addEventListener("input", function (e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const val = t.value;

    switch (t.dataset.act) {
      case "mvname": findMv(t.dataset.id).name = val; save(); break;
      case "mvsetup": findMv(t.dataset.id).setup = val; save(); break;
      case "mvstep": findMv(t.dataset.id).step = Math.max(0.5, Number(val) || 5); save(); break;
      case "setw": case "setr": {
        const it = findMv(t.dataset.id);
        const st = it && it.sets[Number(t.dataset.i)];
        const sp = st && st.steps[Number(t.dataset.si)];
        if (!sp) break;
        sp[t.dataset.act === "setw" ? "w" : "r"] = Math.max(0, Number(val) || 0);
        save();
        break;
      }
      case "bklabel": findBlock(t.dataset.id).label = val.slice(0, 24); save(); break;
      case "bknum": {
        const b = findBlock(t.dataset.id);
        if (!b) break;
        const holder = holderOf(b, t.dataset.leg, t.dataset.pi);
        if (!holder) break;
        const k = t.dataset.k;
        holder[k] = val === "" ? (k === "reps" ? 1 : 0) : Math.max(k === "reps" ? 1 : 0, Number(val) || 0);
        save();
        break;
      }
      default: return;
    }
    refreshRow(t.dataset.id);
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "restore-file" && e.target.files[0]) restore(e.target.files[0]);
  });

  // Tapping a number selects it, so typing replaces rather than appends.
  document.addEventListener("focusin", function (e) {
    if (e.target.matches(".field input, .edit-set input")) e.target.select();
  });

  window.addEventListener("scroll", function () {
    $("#topbar").classList.toggle("stuck", window.scrollY > 4);
  }, { passive: true });

  window.addEventListener("beforeunload", saveNow);
  window.addEventListener("pagehide", saveNow);

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/movement/sw.js").catch(function () { /* offline is a bonus */ });
    });
  }
})();
</script>

</body>
</html>
