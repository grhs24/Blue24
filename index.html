<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foothold Now</title>
<meta name="description" content="Foothold Now lives at /foothold-now/ on this site. Redirecting you there now.">

<!-- Search engines: the real site is /foothold-now/. -->
<link rel="canonical" href="https://grhs24.github.io/foothold-now/">

<!--
  Redirect, fastest path first.

  1. JavaScript (below) runs while the page parses and navigates before anything
     renders. It goes first because it is the only step that can carry the query
     string and fragment across; a meta refresh cannot.
  2. The meta refresh underneath is the no-JavaScript fallback.
  3. The visible link is the last resort if both are blocked.

  location.replace() is used rather than location.href so this stub does not
  land in the back button's history.

  Loop safety: this file is only ever served from the origin root. The guard
  below redirects only when the current path is exactly "/", so if this file is
  ever served from anywhere else (including /foothold-now/ itself) it does
  nothing and simply shows the link.
-->
<script>
(function () {
  var TARGET = 'https://grhs24.github.io/foothold-now/';
  if (window.location.pathname === '/') {
    window.location.replace(TARGET + window.location.search + window.location.hash);
  }
})();
</script>

<meta http-equiv="refresh" content="0; url=https://grhs24.github.io/foothold-now/">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='2' y='18' width='9' height='4' rx='2' fill='%2333685A'/%3E%3Crect x='8.5' y='11' width='9' height='4' rx='2' fill='%2333685A' opacity='0.75'/%3E%3Crect x='15' y='4' width='9' height='4' rx='2' fill='%2333685A' opacity='0.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #F2F4EF; --surface: #FCFDFB; --ink: #22302A; --ink2: #59685F;
    --line: #DBE1D7; --accent: #33685A;
    --serif: 'Iowan Old Style', 'Newsreader', Georgia, serif;
    --sans: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141B17; --surface: #1C2521; --ink: #E4EAE5; --ink2: #A2B2A8; --line: #303C35; --accent: #7FC0A8; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 16.5px; line-height: 1.65;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px; text-align: center;
  }
  .card { max-width: 34ch; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 27px; line-height: 1.25; margin: 18px 0 8px; }
  p { color: var(--ink2); margin: 0 0 22px; }
  a.btn {
    display: inline-block; padding: 11px 20px; border-radius: 10px;
    background: var(--accent); color: #FCFDFB; text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <svg width="42" height="42" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="2" y="18" width="9" height="4" rx="2" fill="var(--accent)"></rect>
      <rect x="8.5" y="11" width="9" height="4" rx="2" fill="var(--accent)" opacity="0.75"></rect>
      <rect x="15" y="4" width="9" height="4" rx="2" fill="var(--accent)" opacity="0.5"></rect>
    </svg>
    <h1>Foothold Now</h1>
    <p>Taking you to the site now.</p>
    <a class="btn" href="https://grhs24.github.io/foothold-now/">Continue to Foothold Now</a>
  </div>
</body>
</html>
